# Why a macOS job exists when macOS is the development platform.
#
# Not to test the OS. This project is written and run on an arm64 Mac every day, so macOS is
# the best-exercised platform there is. What has NEVER been exercised is macOS on a CLEAN
# machine, and that is a different thing:
#
#   - The `imagecodecs` defect that the Linux workflow found was not a Linux defect at all.
#     tifffile refuses the floating-point predictor without it, nothing pulls it in
#     transitively, and it was missing from requirements.txt for as long as the images have
#     been in that format. It was invisible here only because this machine had the package
#     pip-installed by hand years ago. A clean macOS runner would have caught it just as fast.
#     Every other hand-installed package on the development machine is the same latent risk.
#
#   - macOS is the SHIPPED configuration: SAM on Apple Silicon, the full ensemble. So this is
#     the one job in either workflow that can run the real detector and check the answer. The
#     Linux jobs mostly run with SAM off, where the detector marks 26.9-83.7% of a crack-free
#     specimen as crack, and every check can pass while the prediction is that wrong. This job
#     ingests a real frame with SAM ENABLED and checks the answer: that the ensemble ran and
#     not the fallback, and that the area is nowhere near the 54.80% the SAM-free path gives.
#     That is the difference between "the plumbing ran" and "the model that was supposed to
#     run, ran".
#
# THE DIVERGENCE THIS JOB FOUND, and what it turned out to be. The first run produced a
# predicted area of 0.0925 on the reference frame where four other environments all produce
# 0.1880 (this project's Mac on MPS, the same Mac with SAM forced to CPU, a clean worktree
# recomputing from scratch, and an ubuntu-24.04 x86_64 runner). The prediction report
# localised it: the decoded input is bit-identical (same shape, same sha1, same statistics),
# but the probability map is not -- mean 0.369 against 0.381, std 0.264 against 0.300, six
# times as much mass within 0.05 of the threshold, and a mask shattered into 21,020
# components instead of 968, so speck pruning removes 45.3% of it instead of 1.7%.
#
# Four candidate causes were tested and all four are refuted, by measurement:
#   - a differently decoded image: input checksums match, and a doubled denominator would
#     print 0.0940, not 0.0925
#   - a different BLAS: the stock PyPI arm64 wheels link Accelerate in both places, and the
#     predict path is two small GEMM stacks and otherwise BLAS-free
#   - geometry or tiling: all four tiles are exactly 1024x1024, so the reflect-pad path is
#     never entered, and the Hann blend is a weighted mean that coverage cannot bias
#   - the SamProcessor backend: it DOES differ between this project's Mac and the runners
#     (torchvision was hand-installed here and unpinned -- now pinned), but the Linux runner
#     reproduces 0.1880 using the same backend the macOS one used. 9 flipped pixels of
#     2,857,784.
#
# What is left is the device, and the matrix below CONFIRMED it: same runner image, same
# install, one arm forced to cpu and one left on auto (which resolves to mps here).
#
#                       cpu arm        auto/mps arm
#   prob mean           0.381305        0.369239
#   prob std            0.299955        0.264032
#   raw area / comps    0.191281/968    0.169033/21019
#   pruned area         0.1880          0.0925
#
# The cpu arm reproduces this project's Mac and the Linux runner to six decimals. So the SAM
# device is the whole cause. Note this is NOT a property of MPS: on real Apple silicon MPS and
# CPU agree closely -- embeddings differ by at most one float16 storage quantum (4.9e-4), zero
# pixels change side of the threshold, and the area is 0.187972 either way. It is a property of
# this virtualised Metal stack. TXM_SAM_DEVICE=cpu is the workaround, and the cpu arm below is
# asserted strictly so the workaround cannot rot.
#
# WHAT THIS DOES NOT COVER:
#   - REAL Apple-silicon MPS. This header originally said Metal was "generally unavailable" on
#     these virtualised runners, so the device order would resolve to cpu. That was WRONG, and
#     the prediction report said so: torch reports mps available here and the encoder ran on
#     it. What is NOT covered is MPS on real hardware -- the runner's Metal stack is
#     virtualised and demonstrably does not agree with a physical M-series GPU, which is the
#     divergence recorded below. Real-hardware MPS is exercised only by hand.
#   - THE CORPUS, RETRAIN, MEMORY, THE BROWSER. Same as the Linux workflow -- see the header
#     of .github/workflows/linux.yml, which spells all of it out. One frame is checked out,
#     not 71, so corpus-wide checks report "1 frame" or skip.
#   - The runner label is NOT pinned the way ubuntu-24.04 is in the Linux workflow. macOS
#     image labels are retired faster, and a stale pin fails the whole workflow with a
#     "no runner matching" error that says nothing about this project. The actual OS and
#     architecture are logged in the environment step instead.

name: macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAME: images/Average_mosaic_260618_b2_336_25_idx00000_mosaictileAA_img001of010.xrm.bim.bim.tif
  PORT: '8899'
  # GATE vs REFERENCE, and they are deliberately different numbers.
  #
  # AREA_REF is what this frame's ensemble prediction is known to produce: 0.1880. Reproduced
  # in four places -- 18.7972% recorded in app_data meta.json, 18.80% recomputed from scratch
  # in a clean worktree, 18.7972% again with SAM forced onto CPU rather than MPS, and 0.1880
  # on an ubuntu-24.04 x86_64 runner. Four environments, one number.
  #
  # This runner's auto arm produces 0.0925 instead, and the header above records why: the SAM
  # encoder runs on its virtualised Metal stack. Not a float16 or last-bit effect -- only 0.17%
  # of pixels sit in [0.60, 0.65), so halving the area takes a materially different probability
  # map, and the cpu arm of this very matrix reproduces 0.1880 on the same image.
  #
  # So the GATE is the outer sanity bound, asserting what holds on BOTH arms: that the ensemble
  # ran rather than the 17-feature fallback, which reads 0.5480 on this frame, and that it did
  # not come back empty. The strict comparison against AREA_REF lives in the step and applies
  # to the cpu arm only; the auto arm warns. A single gate pinned to AREA_REF would fail this
  # runner's mps arm for a reason that is understood and documented, not a regression.
  AREA_MIN: '0.02'
  AREA_MAX: '0.35'
  AREA_REF: '0.1880'

jobs:
  suite:
    name: real ensemble on macos, SAM on ${{ matrix.device }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      # THE DIAGNOSIS, AS A TEST. The two arms differ in one thing: which device the SAM
      # encoder runs on. If cpu reproduces the reference 0.1880 on the same runner image where
      # auto (which resolves to mps here) gives 0.0925, then the device is the cause and
      # nothing else is. fail-fast is off because the whole point is to see BOTH numbers.
      fail-fast: false
      matrix:
        device: [auto, cpu]
    env:
      TXM_SAM_DEVICE: ${{ matrix.device }}
    steps:
      # Same reasoning as the Linux workflow: images/ is 2,156 MB of the 2,171 MB tracked
      # here, and the self test builds its fixture from a real frame, so exactly one frame
      # is fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/images/*
            /images/Average_mosaic_260618_b2_336_25_idx00000_mosaictileAA_img001of010.xrm.bim.bim.tif

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-py312-${{ hashFiles('requirements.txt') }}

      # ~2.4 GB of SAM weights. Cached, or every run re-downloads them.
      - name: Cache the SAM weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sam-vit-huge-macos-v1

      # Informational only. The point of printing the device availability is that it records
      # which branch of the cuda -> mps -> cpu order actually ran, so nobody later reads this
      # job as evidence that the Metal path works.
      - name: Show the environment the claims are about
        run: |
          sw_vers || true
          uname -m || true
          python3 -VV || true
          df -h . | tail -1 || true
          echo "checkout: $(du -sh . | cut -f1), images/: $(ls images | wc -l) file(s)"

      - name: Install requirements.txt as written
        run: |
          python3 -m venv .venv
          ./.venv/bin/python3 -m pip install -q --upgrade pip
          ./.venv/bin/python3 -m pip install -q -r requirements.txt
          ./.venv/bin/python3 -c "
          import torch
          print('torch', torch.__version__)
          print('cuda available:', torch.cuda.is_available())
          print('mps  available:', torch.backends.mps.is_available())
          print('mps  built    :', torch.backends.mps.is_built())"

      # THE CLEAN-MACHINE CHECK. This is the whole reason the job exists: the development Mac
      # has imagecodecs installed by hand, so this read succeeded there for years while
      # requirements.txt did not ask for it.
      - name: A shipped predictor-3 float32 TIFF actually reads
        run: |
          ./.venv/bin/python3 -m pip show imagecodecs > /dev/null || {
            echo "::error::imagecodecs is not installed -- requirements.txt has regressed"; exit 1; }
          ./.venv/bin/python3 -c "
          import tifffile, numpy as np, os
          f = os.environ['FRAME']
          p = tifffile.TiffFile(f).pages[0]
          print('predictor', p.predictor, 'dtype', p.dtype, 'compression', p.compression)
          assert int(p.predictor) == 3, f'expected the floating-point predictor, got {p.predictor}'
          a = tifffile.imread(f)
          assert a.dtype == np.float32 and a.ndim == 2, (a.dtype, a.shape)
          assert np.isfinite(a).all(), 'the decoded frame contains non-finite values'
          print('read ok', a.shape, a.dtype)"

      - name: Expand the shipped correction masks
        run: |
          mkdir -p app_data/images app_data/models models dataset_cache paint/corrections
          ./.venv/bin/python3 code/unpack_package.py
          echo "corrections: $(ls paint/corrections | wc -l) file(s)"

      # NOTE what is absent here: TXM_NO_SAM. Unlike every job in the Linux workflow except
      # sam-on-linux, this one runs the shipped configuration.
      - name: Start the server with SAM enabled
        run: |
          ./.venv/bin/python3 app/server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 120); do
            curl -sf -o /dev/null "http://127.0.0.1:${PORT}/" && break
            kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || {
              echo "::error::the server exited before serving"; cat "$RUNNER_TEMP/server.log"; exit 1; }
            sleep 1
          done
          curl -sf -o /dev/null -w 'GET / -> HTTP %{http_code}\n' "http://127.0.0.1:${PORT}/"

      # The 2.4 GB fetch happens here on a cold cache, then four SAM tiles, so the poll is
      # generous. A real frame, the real ensemble, and the answer is checked.
      - name: Ingest a real frame and check the ensemble's answer
        run: |
          curl -sf -X POST -F "files=@${FRAME}" "http://127.0.0.1:${PORT}/api/upload" > /dev/null
          for i in $(seq 1 300); do
            ST=$(curl -sf "http://127.0.0.1:${PORT}/api/images" | ./.venv/bin/python3 -c "
          import sys, json
          r = [m for m in json.load(sys.stdin)['images'] if 'SELFTEST' not in (m.get('filename') or '')]
          print(r[0].get('status', '?') if r else 'none')")
            case "$ST" in
              ready) break;;
              error|failed) echo "::error::ingest failed"; cat "$RUNNER_TEMP/server.log"; exit 1;;
            esac
            sleep 4
          done
          test "$ST" = ready || {
            echo "::error::ingest never reached ready (last: $ST)"
            cat "$RUNNER_TEMP/server.log"; exit 1; }
          curl -sf "http://127.0.0.1:${PORT}/api/images" | ./.venv/bin/python3 -c "
          import sys, json, os
          m = [x for x in json.load(sys.stdin)['images']
               if 'SELFTEST' not in (x.get('filename') or '')][0]
          desc, area = m.get('model') or '', m.get('predicted_area')
          lo, hi = float(os.environ['AREA_MIN']), float(os.environ['AREA_MAX'])
          print('model:', desc)
          print(f'area : {area:.4f}   band [{lo}, {hi}]   recorded 0.1880')
          # The ensemble really ran -- not the fallback wearing its name.
          assert 'SAM unavailable' not in desc, f'SAM was not used: {desc!r}'
          assert 'ensemble' in desc, f'not the ensemble: {desc!r}'
          # ...and produced an answer in the right place. 0.5480 is what the 17-feature
          # fallback gives on this frame, so this is what separates the two.
          assert area is not None and lo <= area <= hi, (
              f'ensemble area {area} outside [{lo}, {hi}] -- 0.548 would mean the '
              f'17-feature fallback ran, and a much smaller number would mean it '
              f'found almost nothing')
          ref, dev = float(os.environ['AREA_REF']), os.environ.get('TXM_SAM_DEVICE', 'auto')
          off = abs(area - ref)
          if dev == 'cpu':
              # STRICT on cpu. Five environments produce the reference on cpu or on real
              # Apple silicon, so a cpu run that does not is a genuine regression. This is
              # also the arm that confirms the diagnosis: if it passes while the auto arm
              # warns, the device is the whole story.
              assert off <= 0.03, (
                  f'cpu run gave {area:.4f}, {off:.4f} away from the reference {ref:.4f} -- '
                  f'cpu is expected to reproduce it')
              print(f'cpu reproduces the reference ({area:.4f} vs {ref:.4f})')
          elif off > 0.03:
              # Not a failure. This is the known, documented divergence of this runner's
              # virtualised Metal stack, kept visible rather than either hidden or fatal.
              print(f'::warning::SAM on {dev} gave {area:.4f}, {off:.4f} from the reference '
                    f'{ref:.4f}. Known: this runner image diverges on MPS. Compare the two '
                    f'matrix arms and the prediction reports below.')
          else:
              print(f'SAM on {dev} reproduces the reference ({area:.4f} vs {ref:.4f})')
          print('the shipped ensemble ran and its answer is inside the gate')"


      # Prints the intermediates -- input checksum, probability distribution, area before and
      # after pruning, component counts, every version -- so two machines can be compared
      # line by line. `always()` because a failed assertion above is exactly when it is
      # needed. See the header of code/prediction_report.py.
      - name: Prediction report (diagnostic, never fails the job)
        if: always()
        run: ./.venv/bin/python3 code/prediction_report.py || true
      # Runs against the same SAM-enabled server, so the fixture ingest exercises the real
      # ensemble too rather than the 17-feature fallback.
      - name: Self test
        run: ./.venv/bin/python3 app/selftest.py --base "http://127.0.0.1:${PORT}"

      - name: Stop the server
        if: always()
        run: |
          test -f "$RUNNER_TEMP/server.pid" && kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          tail -30 "$RUNNER_TEMP/server.log" || true

      - name: Nothing tracked was modified by the run
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::the run left the tree dirty -- see the list above"; exit 1; }
